[project]
name = "production-tracker"
version = "0.1.0"
description = "Production Tracker: work orders, floor tracking and production statistics for the factory intranet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash>=4.4.1",
    "fastapi>=0.141.1",
    "psycopg[binary,pool]>=3.3.5",
    "pwdlib[argon2]>=0.3.1",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "zxcvbn>=4.5.0",
    "uvicorn>=0.30.0",
    "pillow>=12.3.0",
    "segno>=1.6.6",
]

[dependency-groups]
dev = ["httpx2"]
